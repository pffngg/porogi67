<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Porogi67 — сайт переехал</title>

  <meta
    name="description"
    content="Сайт Porogi67 переехал на новый адрес."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08090b;
      --bg-soft: #111217;
      --card: rgba(20, 21, 27, 0.72);
      --border: rgba(255, 255, 255, 0.08);

      --text: #ffffff;
      --muted: #9d9faa;

      --accent: #ff0033;
      --accent-light: #ff3b5f;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 0, 51, 0.13),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(255, 0, 51, 0.08),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      position: relative;
    }

    .background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;

      border-radius: 999px;

      filter: blur(90px);
      opacity: 0.5;

      animation: float 12s ease-in-out infinite;
    }

    .orb.one {
      width: 360px;
      height: 360px;

      background: rgba(255, 0, 51, 0.28);

      top: -120px;
      left: -100px;
    }

    .orb.two {
      width: 300px;
      height: 300px;

      background: rgba(255, 60, 90, 0.16);

      bottom: -130px;
      right: -100px;

      animation-delay: -5s;
    }

    .orb.three {
      width: 220px;
      height: 220px;

      background: rgba(255, 0, 51, 0.12);

      top: 45%;
      left: 55%;

      animation-delay: -8s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(35px, -25px, 0) scale(1.08);
      }
    }

    .noise {
      position: absolute;
      inset: 0;

      opacity: 0.04;

      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.08) 0,
          rgba(255,255,255,0.08) 1px,
          transparent 1px,
          transparent 3px
        );

      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 2;

      width: min(92%, 760px);

      padding: 24px;
    }

    .card {
      position: relative;

      padding: 58px 42px 42px;

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.02)
        ),
        var(--card);

      border: 1px solid var(--border);

      border-radius: 30px;

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      overflow: hidden;

      animation: cardAppear 0.9s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 240px;
      height: 240px;

      border-radius: 50%;

      background: rgba(255, 0, 51, 0.12);

      filter: blur(70px);

      top: -130px;
      left: 50%;

      transform: translateX(-50%);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 32px;

      color: #d8d8de;

      font-size: 14px;
      font-weight: 700;

      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 5px rgba(255, 0, 51, 0.1),
        0 0 24px rgba(255, 0, 51, 0.7);

      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.15);
        opacity: 0.7;
      }
    }

    h1 {
      max-width: 620px;

      font-size: clamp(42px, 7vw, 76px);
      line-height: 0.98;

      letter-spacing: -0.055em;

      font-weight: 850;

      margin-bottom: 22px;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #d8d9df 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      max-width: 560px;

      color: var(--muted);

      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.6;

      margin-bottom: 36px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      min-height: 58px;

      padding: 0 24px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-light)
        );

      color: white;

      text-decoration: none;

      font-size: 16px;
      font-weight: 750;

      box-shadow:
        0 14px 40px rgba(255, 0, 51, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
    }

    .button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 18px 50px rgba(255, 0, 51, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);

      filter: brightness(1.05);
    }

    .button:active {
      transform: translateY(0) scale(0.98);
    }

    .arrow {
      width: 22px;
      height: 22px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.25s ease;
    }

    .button:hover .arrow {
      transform: translateX(4px);
    }

    .footer {
      margin-top: 28px;

      color: #666874;

      font-size: 13px;
    }

    .line {
      position: absolute;

      width: 1px;
      height: 130px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.18),
          transparent
        );

      animation: lineMove 8s linear infinite;
    }

    .line:nth-child(1) {
      left: 20%;
      top: -130px;
    }

    .line:nth-child(2) {
      left: 70%;
      top: -230px;

      animation-delay: -3s;
    }

    .line:nth-child(3) {
      left: 88%;
      top: -180px;

      animation-delay: -5s;
    }

    @keyframes lineMove {
      from {
        transform: translateY(-20vh);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      80% {
        opacity: 0.8;
      }

      to {
        transform: translateY(130vh);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .wrapper {
        width: 100%;
        padding: 18px;
      }

      .card {
        padding: 42px 26px 30px;
        border-radius: 24px;
      }

      .brand {
        margin-bottom: 26px;
      }

      h1 {
        font-size: 48px;
      }

      .subtitle {
        font-size: 16px;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <div class="noise"></div>

  <main class="wrapper">
    <section class="card">

      <div class="brand">
        <span class="brand-dot"></span>
        Porogi67
      </div>

      <h1>
        Сайт переехал сюда
      </h1>

      <p class="subtitle">
        Я перенес Porogi67 на новый адрес.
        Все актуальные функции теперь находятся на новом сайте.
      </p>

      <a
        class="button"
        href="https://porogi67.webtm.ru/"
      >
        Перейти на актуальный сайт

        <span class="arrow">
          →
        </span>
      </a>

      <div class="footer">
        porogi67.webtm.ru
      </div>

    </section>
  </main>

</body>
</html>
