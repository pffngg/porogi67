<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Porogi67 — сайт переехал</title>

  <meta
    name="description"
    content="Сайт Porogi67 переехал на новый адрес."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07080b;
      --card: rgba(18, 19, 24, 0.76);

      --text: #ffffff;
      --muted: #a5a7b2;

      --accent: #ff0033;
      --accent-light: #ff4969;

      --border: rgba(255, 255, 255, 0.09);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    html {
      background: var(--bg);
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      position: relative;

      perspective: 1200px;

      background:
        radial-gradient(
          circle at 18% 18%,
          rgba(255, 0, 51, 0.13),
          transparent 32%
        ),
        radial-gradient(
          circle at 82% 80%,
          rgba(255, 0, 51, 0.08),
          transparent 32%
        ),
        var(--bg);
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: absolute;
      inset: -8%;

      overflow: hidden;

      pointer-events: none;

      will-change: transform;
    }

    .orb {
      position: absolute;

      border-radius: 999px;

      filter: blur(95px);

      opacity: 0.5;

      animation: orbFloat 13s ease-in-out infinite;
    }

    .orb.one {
      width: 420px;
      height: 420px;

      top: -160px;
      left: -130px;

      background: rgba(255, 0, 51, 0.30);
    }

    .orb.two {
      width: 360px;
      height: 360px;

      right: -150px;
      bottom: -160px;

      background: rgba(255, 45, 78, 0.18);

      animation-delay: -5s;
    }

    .orb.three {
      width: 250px;
      height: 250px;

      left: 54%;
      top: 42%;

      background: rgba(255, 0, 51, 0.10);

      animation-delay: -8s;
    }

    @keyframes orbFloat {
      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(36px, -28px, 0) scale(1.08);
      }
    }

    /* =========================
       FALLING LIGHT LINES
    ========================= */

    .line {
      position: absolute;

      width: 1px;
      height: 150px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.19),
          transparent
        );

      opacity: 0;

      animation: lineMove 9s linear infinite;
    }

    .line.one {
      left: 18%;
      top: -180px;
    }

    .line.two {
      left: 68%;
      top: -260px;

      animation-delay: -3s;
    }

    .line.three {
      left: 88%;
      top: -220px;

      animation-delay: -6s;
    }

    @keyframes lineMove {
      0% {
        transform: translateY(-15vh);
        opacity: 0;
      }

      15% {
        opacity: 0.7;
      }

      80% {
        opacity: 0.7;
      }

      100% {
        transform: translateY(140vh);
        opacity: 0;
      }
    }

    /* =========================
       NOISE / TEXTURE
    ========================= */

    .noise {
      position: absolute;
      inset: 0;

      pointer-events: none;

      opacity: 0.035;

      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.08) 0,
          rgba(255,255,255,0.08) 1px,
          transparent 1px,
          transparent 3px
        );
    }

    /* =========================
       WRAPPER
    ========================= */

    .wrapper {
      position: relative;
      z-index: 2;

      width: min(92%, 780px);

      padding: 24px;

      transform-style: preserve-3d;

      will-change: transform;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      position: relative;

      overflow: hidden;

      padding: 60px 44px 42px;

      border-radius: 30px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.015)
        ),
        var(--card);

      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);

      box-shadow:
        0 32px 110px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(255, 255, 255, 0.015),
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 -1px 0 rgba(255, 255, 255, 0.015);

      animation:
        cardAppear 0.9s cubic-bezier(.2,.8,.2,1) both;

      transform-style: preserve-3d;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      left: 50%;
      top: -170px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        rgba(255, 0, 51, 0.16);

      filter: blur(80px);

      pointer-events: none;
    }

    /* Световой блик */

    .card::after {
      content: "";

      position: absolute;

      top: -45%;
      left: -60%;

      width: 36%;
      height: 190%;

      transform: rotate(12deg);

      background:
        linear-gradient(
          110deg,
          transparent 0%,
          rgba(255,255,255,0.01) 28%,
          rgba(255,255,255,0.11) 48%,
          rgba(255,255,255,0.035) 58%,
          transparent 76%
        );

      filter: blur(2px);

      pointer-events: none;

      opacity: 0;

      z-index: 1;

      animation:
        cardShine 7s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    .card > * {
      position: relative;
      z-index: 2;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.965);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes cardShine {
      0%,
      52% {
        left: -60%;
        opacity: 0;
      }

      58% {
        opacity: 1;
      }

      78% {
        opacity: 1;
      }

      88%,
      100% {
        left: 130%;
        opacity: 0;
      }
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: inline-flex;
      align-items: center;

      gap: 11px;

      margin-bottom: 34px;

      color: #dedfe4;

      font-size: 13px;
      font-weight: 750;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      opacity: 0;

      animation:
        fadeUp 0.6s ease forwards;

      animation-delay: 0.08s;
    }

    .brand-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 5px rgba(255, 0, 51, 0.10),
        0 0 26px rgba(255, 0, 51, 0.75);

      animation:
        pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.18);
        opacity: 0.7;
      }
    }

    /* =========================
       BIG TITLE
    ========================= */

    h1 {
      max-width: 680px;

      margin-bottom: 26px;

      color: #ffffff;

      font-size: clamp(48px, 7.2vw, 78px);

      font-weight: 850;

      line-height: 0.98;

      letter-spacing: -0.055em;

      text-shadow:
        0 2px 16px rgba(255, 255, 255, 0.06),
        0 12px 45px rgba(0, 0, 0, 0.25);
    }

    .word {
      display: inline-block;

      opacity: 0;

      transform:
        translateY(22px)
        scale(0.985);

      animation:
        wordAppear 0.7s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .word:nth-child(1) {
      animation-delay: 0.15s;
    }

    .word:nth-child(2) {
      animation-delay: 0.24s;
    }

    .word:nth-child(3) {
      animation-delay: 0.33s;
    }

    @keyframes wordAppear {
      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    /* =========================
       TEXT
    ========================= */

    .subtitle {
      max-width: 590px;

      margin-bottom: 38px;

      color: var(--muted);

      font-size: clamp(17px, 2vw, 20px);

      line-height: 1.65;

      opacity: 0;

      transform: translateY(16px);

      animation:
        fadeUp 0.7s ease forwards;

      animation-delay: 0.55s;
    }

    /* =========================
       BUTTON
    ========================= */

    .button {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      min-height: 60px;

      padding: 0 25px;

      border-radius: 18px;

      color: #ffffff;

      font-size: 16px;
      font-weight: 750;

      text-decoration: none;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-light)
        );

      box-shadow:
        0 14px 42px rgba(255, 0, 51, 0.27),
        inset 0 1px 0 rgba(255,255,255,0.24);

      opacity: 0;

      transform: translateY(16px);

      animation:
        fadeUp 0.7s ease forwards;

      animation-delay: 0.72s;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
    }

    .button:hover {
      transform: translateY(-3px);

      filter: brightness(1.06);

      box-shadow:
        0 19px 54px rgba(255, 0, 51, 0.37),
        inset 0 1px 0 rgba(255,255,255,0.27);
    }

    .button:active {
      transform:
        translateY(0)
        scale(0.98);
    }

    .arrow {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 22px;
      height: 22px;

      font-size: 21px;

      transition:
        transform 0.25s ease;
    }

    .button:hover .arrow {
      transform: translateX(4px);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 30px;

      color: #686b77;

      font-size: 13px;

      opacity: 0;

      transform: translateY(10px);

      animation:
        fadeUp 0.7s ease forwards;

      animation-delay: 0.88s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        align-items: center;
      }

      .wrapper {
        width: 100%;
        padding: 18px;
      }

      .card {
        padding:
          42px
          26px
          30px;

        border-radius: 24px;
      }

      .brand {
        margin-bottom: 28px;
      }

      h1 {
        font-size: clamp(45px, 13vw, 60px);

        line-height: 1;

        margin-bottom: 24px;
      }

      .subtitle {
        font-size: 16px;

        line-height: 1.6;
      }

      .button {
        width: 100%;

        min-height: 58px;

        padding: 0 18px;
      }

      .footer {
        text-align: center;
      }
    }

    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div
    class="background"
    id="background"
  >

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div class="line one"></div>
    <div class="line two"></div>
    <div class="line three"></div>

  </div>

  <div class="noise"></div>

  <main
    class="wrapper"
    id="wrapper"
  >

    <section class="card">

      <div class="brand">
        <span class="brand-dot"></span>
        Porogi67
      </div>

      <h1>
        <span class="word">Сайт</span>
        <span class="word">переехал</span>
        <span class="word">сюда</span>
      </h1>

      <p class="subtitle">
        Я перенес porogi67 на новый адрес.
        Все актуальные функции теперь находятся на новом сайте.
      </p>

      <a
        class="button"
        href="https://porogi67.webtm.ru/"
      >

        Перейти на актуальный сайт

        <span class="arrow">
          →
        </span>

      </a>

      <div class="footer">
        porogi67.webtm.ru
      </div>

    </section>

  </main>

  <script>

    const wrapper =
      document.getElementById("wrapper");

    const background =
      document.getElementById("background");

    let currentX = 0;
    let currentY = 0;

    let targetX = 0;
    let targetY = 0;

    let mouseActive = false;

    function animateParallax() {

      currentX +=
        (targetX - currentX) * 0.065;

      currentY +=
        (targetY - currentY) * 0.065;

      wrapper.style.transform = `
        rotateY(${currentX * 3}deg)
        rotateX(${-currentY * 3}deg)
        translate3d(
          ${currentX * 5}px,
          ${currentY * 5}px,
          0
        )
      `;

      background.style.transform = `
        translate3d(
          ${-currentX * 20}px,
          ${-currentY * 20}px,
          0
        )
      `;

      requestAnimationFrame(
        animateParallax
      );
    }

    window.addEventListener(
      "mousemove",
      (event) => {

        mouseActive = true;

        targetX =
          event.clientX /
          window.innerWidth -
          0.5;

        targetY =
          event.clientY /
          window.innerHeight -
          0.5;
      }
    );

    window.addEventListener(
      "mouseleave",
      () => {

        mouseActive = false;

        targetX = 0;
        targetY = 0;
      }
    );

    window.addEventListener(
      "blur",
      () => {

        targetX = 0;
        targetY = 0;
      }
    );

    animateParallax();

  </script>

</body>
</html>
